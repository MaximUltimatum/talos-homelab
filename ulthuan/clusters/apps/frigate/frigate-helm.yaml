apiVersion: v1
kind: Namespace
metadata:
  name: frigate
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: frigate
  namespace: frigate
spec:
  interval: 10m # How often to check for updates
  url: "https://blakeblackshear.github.io/blakeshome-charts"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
  namespace: frigate
spec:
  interval: 1h
  chart:
    spec:
      chart: frigate
      version: 7.8.0
      sourceRef:
        kind: HelmRepository
        name: frigate
  targetNamespace: frigate
  values:
    image:
      repository: ghcr.io/blakeblackshear/frigate
      tag: 0.17.2-tensorrt
    env:
      TZ: CST
    envFromSecrets:
      - frigate-rstp-credentials
    securityContext:
      privileged: true
    config: |
      mqtt:
        host: mosquitto.mosquitto.svc.cluster.local
        port: 1883
        stats_interval: 60
      detectors:
        onnx:
          type: onnx
      model:
        model_type: yolonas
        width: 320 # <--- should match whatever was set in notebook
        height: 320 # <--- should match whatever was set in notebook
        input_pixel_format: bgr
        input_tensor: nchw
        path: "plus://0a01efc8a5df1c019c5278953c8d9b39"
        labelmap_path: /labelmap/coco-80.txt

      objects:
        track:
          - person
          - face
          - bicycle
          - motorcycle
          - amazon
          - usps
          - ups
          - fedex
          - package
          
      record:
        enabled: True
        retain:
          days: 0
        alerts:
          retain:
            days: 14
            mode: motion
        detections:
          retain:
            days: 14
            mode: motion

      face_recognition:
        enabled: True
      lpr:
        enabled: True
      audio_transcription:
        enabled: True
      audio:
        enabled: True

      snapshots:
        enabled: true
        retain:
          default: 15

      detect:
        enabled: true
      cameras:
        backyard: # camera name
          ffmpeg:
            inputs:
              - path: rtsp://{FRIGATE_RSTP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@192.168.4.84:554/cam/realmonitor?channel=1&subtype=0
                roles:
                  - detect
                  - record
        garage:
          ffmpeg:
            inputs:
              - path: rtsp://{FRIGATE_RSTP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@192.168.4.85:554/cam/realmonitor?channel=1&subtype=0
                roles:
                  - detect
                  - record

    service:
      type: LoadBalancer
      port: 5000
      annotations:
        tailscale.com/hostname: pierce
      labels:
        tailscale.com/proxy-class: "irish-eyes"
    persistence:
      config:
        enabled: true
        size: 10Gi
      media:
        enabled: true
        size: 300Gi
        skipuninstall: true
    nodeSelector:
      has: gpu
