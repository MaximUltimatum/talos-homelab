---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: disk.pretty_size == '250 GB'
  grow: true
  minSize: 2GB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn-nvme1
provisioning:
  diskSelector:
    match: disk.pretty_size == '1.0 TB'
  grow: true
  maxSize: 1TB
