---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: disk.transport == 'nvme'
  grow: true
  maxSize: 100GB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn-nvme
provisioning:
  diskSelector:
    match: disk.transport == 'nvme'
  grow: true
  maxSize: 150GB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn-data
provisioning:
  diskSelector:
    match: disk.transport == 'sata'
  grow: true
  maxSize: 2TB
